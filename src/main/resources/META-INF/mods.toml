[[mods]]
modId="claimguard"
version="0.1.0"
displayName="ClaimGuard"
authors="robmc"
description='''
Clan land-protection and siege system. Craft a Clan Charter, gather signatures,
found a clan, and place a Claim Core beacon to protect a full-height column of
land for your clan. Upgrade it with diamonds and blaze rods, bind your respawn
to it, ally or war other clans, and siege enemy claims during their chosen raid
window. Operators can place Admin Cores to protect spawn (PvP off, no mob spawns).
Install on both the server and every client.
'''

[[dependencies.claimguard]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.claimguard]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

[[mods]]
modId="rpgstats"
version="0.1.0"
displayName="RPG Stats"
authors="robmc"
description='''
A Dark-Age-of-Camelot-style stat system. Health, Stamina and Mana pools
(start ~300, cap 450) fed by six trainable stats - Strength, Vitality,
Dexterity, Quickness, Intelligence, Wisdom - each raised by the matching
actions (mining, chopping, archery, moving, casting, fishing...). Bundled
with ClaimGuard; install on the server and every client.
'''

[[dependencies.rpgstats]]
    modId="claimguard"
    mandatory=true
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.rpgstats]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.rpgstats]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

[[mods]]
modId="combat"
version="0.1.0"
displayName="Reforged Melee"
authors="robmc"
description='''
A Darkfall / Rise-of-Agon style melee overhaul: forced third-person while a
melee weapon is out, heavier and slower swings, a wide cleave arc that hits
everything in front of you, and a 5-hit combo whose finisher crits. Standalone -
no dependency on the other mods in this pack. Install on the server and every client.
'''

[[dependencies.combat]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.combat]]
