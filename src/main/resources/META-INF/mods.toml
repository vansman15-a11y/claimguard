[[mods]]
modId="claimguard"
version="0.1.0"
displayName="ClaimGuard"
authors="robmc"
description='''
Clan land-protection and siege system. Craft a Clan Charter, gather signatures,
found a clan, and place a Claim Core beacon to protect a full-height column of
land for your clan. Upgrade it with diamonds and blaze rods, bind your respawn
to it, ally or war other clans, and siege enemy claims during their chosen raid
window. Operators can place Admin Cores to protect spawn (PvP off, no mob spawns).
Install on both the server and every client.
'''

